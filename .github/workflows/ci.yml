name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notelet
          POSTGRES_PASSWORD: notelet
          POSTGRES_DB: notelet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notelet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p notelet-core -p notelet-mcp --all-targets -- -D warnings
      - name: test
        run: |
          cargo test -p notelet-core
          cargo test -p notelet-mcp
      - name: test (postgres)
        env:
          NOTELET_TEST_DATABASE_URL: postgres://notelet:notelet@localhost:5432/notelet_test
        run: cargo test -p notelet-core --test pg -- --nocapture

# release-plz (dispatched release PR + OIDC publish) and cargo-dist are added
# when the crates are first published; see CONTRIBUTING.md "Releases".
